services:
  db:
    image: postgres:15
    container_name: jade_db
    environment:
      POSTGRES_USER: jade_user
      POSTGRES_PASSWORD: jade_password
      POSTGRES_DB: jade_archive
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jade_network
    restart: unless-stopped

  app:
    build: ./backend
    container_name: jade_app
    environment:
      DATABASE_URL: postgresql://jade_user:jade_password@db:5432/jade_archive
    ports:
      - "8000:8000"
    networks:
      - jade_network
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: jade_frontend
    ports:
      - "3000:80"
    networks:
      - jade_network
    depends_on:
      - app
    restart: unless-stopped

networks:
  jade_network:
    driver: bridge

volumes:
  postgres_data: